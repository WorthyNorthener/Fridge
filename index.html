<title>Холодильник</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--card:#fff;--tx:#000;--mu:rgba(60,60,67,.6);--ln:rgba(60,60,67,.22);--fill:rgba(118,118,128,.12);--ph:rgba(60,60,67,.3);--ac:#0a68d6;--act:#0a68d6;--chip:color-mix(in srgb,var(--act) 14%,transparent);--acx:#fff;--ok:#248a3d;--wn:#c25100;--rd:#d70015;--r:26px;--ri:16px;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#1c1c1e;--tx:#fff;--mu:rgba(235,235,245,.6);--ln:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--ph:rgba(235,235,245,.3);--ac:#0f6edb;--act:#5eb0ff;--ok:#30d158;--wn:#ff9f0a;--rd:#ff453a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#000;--card:#1c1c1e;--tx:#fff;--mu:rgba(235,235,245,.6);--ln:rgba(84,84,88,.6);--fill:rgba(118,118,128,.24);--ph:rgba(235,235,245,.3);--ac:#0f6edb;--act:#5eb0ff;--ok:#30d158;--wn:#ff9f0a;--rd:#ff453a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",system-ui,sans-serif;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
main{max-width:560px;margin:0 auto;padding:16px 16px 140px}
h1{margin:12px 4px 2px;font-size:34px;font-weight:700;line-height:1.15;letter-spacing:.011em}
#sum,#hsum{margin:0 4px 20px;min-height:1.3em;color:var(--mu);font-size:15px}
.grp{background:var(--card);border-radius:var(--r);overflow:hidden}
.grp>*{display:flex;min-height:52px;padding:0 16px}
.grp>*+*{border-top:.5px solid var(--ln)}
input{width:100%;min-height:46px;padding:0 12px;font:inherit;color:var(--tx);background:var(--fill);border:0;border-radius:var(--ri);-webkit-appearance:none;appearance:none}
input::placeholder{color:var(--ph)}
.grp>input{padding:0 16px;background:none;border-radius:0}
.grp>input:focus-visible{outline:none}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label{display:flex;align-items:center;justify-content:space-between;gap:12px}
label span{flex:none}
label input{width:auto;flex:none;min-width:150px;min-height:38px;padding:0 10px;border-radius:12px}
input[type=date]{text-align:left}
input::-webkit-date-and-time-value{text-align:left}
.add{display:block;width:100%;min-height:50px;margin-top:12px;border:0;border-radius:999px;background:var(--ac);color:var(--acx);font:inherit;font-weight:600;touch-action:manipulation}
.add:active{opacity:.7}
ul{list-style:none;margin:24px 0 0;padding:0;background:var(--card);border-radius:var(--r);overflow:hidden}
li{position:relative;display:flex;align-items:center;gap:14px;min-height:76px;padding:12px 8px 12px 16px;cursor:pointer}
li+li::before{content:"";position:absolute;top:0;left:82px;right:0;border-top:.5px solid var(--ln)}
li[data-id]:not(.ed):active,li[data-i]:not(.ed):active{background:var(--fill)}
.ok{--c:var(--ok)}.wn{--c:var(--wn)}.rd{--c:var(--rd)}
.n{flex:none;width:52px;height:52px;display:grid;place-content:center;text-align:center;line-height:1.1;color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border-radius:var(--ri)}
.n b{font-size:20px;font-weight:700}
.n i{font-size:11px;font-style:normal;font-weight:500}
.t{flex:1;min-width:0}
.t b{display:block;font-size:17px;font-weight:600;overflow-wrap:anywhere}
.t small{display:block;margin-top:2px;color:var(--mu);font-size:15px}
.wn .t small,.rd .t small{color:var(--c)}
.x{flex:none;min-height:44px;padding:0 10px;border:0;background:none;color:var(--rd);font:inherit;font-size:15px;touch-action:manipulation}
.em{justify-content:center;min-height:96px;padding:24px;color:var(--mu);text-align:center;cursor:default}
.ed{flex-direction:column;align-items:stretch;gap:10px;padding:14px 16px;cursor:default}
.eb{display:flex;gap:10px}
.eb button{flex:1;min-height:46px;border:0;border-radius:999px;font:inherit;font-weight:600;touch-action:manipulation}
.sv{background:var(--ac);color:var(--acx)}
.cn{background:var(--fill);color:var(--tx)}
#tt{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));pointer-events:none}
.toast{display:flex;align-items:center;gap:12px;width:100%;max-width:528px;padding:8px 8px 8px 20px;background:color-mix(in srgb,var(--card) 72%,transparent);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);border:.5px solid var(--ln);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18);pointer-events:auto}
.toast span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:none;min-height:44px;padding:0 16px;border:0;border-radius:999px;background:var(--fill);color:var(--act);font:inherit;font-weight:600;touch-action:manipulation}

.quick{margin:0 0 16px;padding:14px 16px 16px;background:var(--card);border-radius:var(--r)}
.quick h2{margin:0 0 10px;color:var(--mu);font-size:15px;font-weight:600}
.chips{display:flex;flex-wrap:nowrap;gap:10px;margin:-4px -16px;padding:4px 16px;overflow-x:auto;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips+h2{margin-top:16px}
.chip{flex:none;display:inline-flex;align-items:center;gap:8px;height:40px;padding-right:7px;border-radius:999px;background:var(--chip)}
.chip:active{opacity:.7}
.cb{height:100%;padding:0 0 0 16px;border:0;background:none;color:var(--act);font:inherit;font-weight:500;touch-action:manipulation}
.cx{position:relative;display:grid;place-items:center;width:26px;height:26px;padding:0;border:0;border-radius:50%;background:var(--fill);color:var(--mu);font:inherit;font-size:12px;touch-action:manipulation}
.cx::after{content:"";position:absolute;inset:-7px}

#hl li{min-height:64px}
#hl li+li::before{left:16px}
.hd{width:96px;min-width:96px;text-align:right}
.pl{flex:none;width:36px;height:36px;border:0;border-radius:50%;background:var(--chip);color:var(--act);font:inherit;font-size:22px;line-height:1;display:grid;place-items:center;padding:0;touch-action:manipulation}
#hq{background:none}
.glass{background:color-mix(in srgb,var(--card) 70%,transparent);-webkit-backdrop-filter:blur(24px) saturate(1.8);backdrop-filter:blur(24px) saturate(1.8);border:.5px solid var(--ln);box-shadow:0 8px 28px rgba(0,0,0,.16)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;justify-content:center;gap:12px;padding:0 16px calc(8px + env(safe-area-inset-bottom,0px));pointer-events:none}
#bar{pointer-events:auto;display:flex;flex:1;max-width:420px;padding:5px;border-radius:999px}
#bar button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:54px;border:0;border-radius:999px;background:none;color:var(--mu);font:inherit;font-size:11px;font-weight:600;touch-action:manipulation}
#bar button[aria-current=true]{background:var(--fill);color:var(--act)}
#bar svg{width:24px;height:24px}
#fab{pointer-events:auto;flex:none;display:grid;place-items:center;width:64px;height:64px;padding:0;border:0;border-radius:50%;background:var(--ac);color:var(--acx);box-shadow:0 8px 24px rgba(0,0,0,.25);touch-action:manipulation}
#fab svg{width:28px;height:28px}
#fab:active{opacity:.8}
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;background:rgba(0,0,0,.38);visibility:hidden;opacity:0;transition:opacity .22s,visibility .22s}
.sheet.open{visibility:visible;opacity:1}
.panel{width:100%;max-width:560px;max-height:92%;margin:0 auto;overflow-y:auto;padding:10px 16px calc(16px + env(safe-area-inset-bottom,0px));background:var(--bg);border-radius:var(--r) var(--r) 0 0;transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.sheet.open .panel{transform:none}
.sh-h{display:grid;grid-template-columns:34px 1fr 34px;align-items:center;margin:6px 0 16px;text-align:center}
.sh-h b{font-size:17px;font-weight:600}
.sh-x{width:34px;height:34px;border:0;border-radius:50%;background:var(--fill);color:var(--mu);font:inherit;font-size:13px;display:grid;place-items:center;padding:0;touch-action:manipulation}

.panel{font-size:17px;font-weight:400;line-height:1.3}
.panel input,.panel button,.panel label{font-family:inherit;font-size:17px}
.panel label,.panel .grp input{color:var(--tx);font-weight:400}
.panel input::placeholder{color:var(--ph);opacity:1}
.panel input[type=date]{-webkit-text-fill-color:var(--tx)}
.panel .add{font-weight:600}
.cx svg,.sh-x svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.pl svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round}
</style>
</head>
<body>
<main>
<section id="v-list">
<h1>Холодильник</h1>
<p id="sum"></p>
<ul id="l"></ul>
</section>
<section id="v-hist" hidden>
<h1>История</h1>
<p id="hsum"></p>
<div class="grp"><input id="hq" type="search" placeholder="Поиск" autocomplete="off"></div>
<ul id="hl"></ul>
</section>
</main>
<div id="dock">
<nav id="bar" class="glass">
<button data-t="list" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="2.5" width="12" height="19" rx="3"/><path d="M6 10h12M9.5 5.5v1.5M9.5 13v3"/></svg>Холодильник</button>
<button data-t="hist" aria-current="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>История</button>
</nav>
<button id="fab" aria-label="Добавить продукт"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
</div>
<div id="sh" class="sheet">
<div class="panel">
<div class="sh-h"><span></span><b>Новый продукт</b><button class="sh-x" id="shx" aria-label="Закрыть"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8"/></svg></button></div>
<section id="qk" class="quick" hidden></section>
<form id="f">
<div class="grp">
<input id="n" placeholder="Название продукта" maxlength="60" autocomplete="off" list="sg" required>
<label><span>Годен до</span><input id="d" type="date" required></label>
</div>
<button class="add">Добавить</button>
</form>
</div>
</div>
<datalist id="sg"></datalist>
<div id="tt"></div>
<script>
const $=id=>document.getElementById(id),K='fridge-v1',NK='fridge-names',HK='fridge-hist';
const pl=(n,a,b,c)=>{const m=n%100,k=n%10;return m>10&&m<20?c:k==1?a:k>1&&k<5?b:c};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let items=rd(K),hist=initHist(),ref=null,q=Promise.resolve(),editId=null,hEdit=null,undo=null,timer=0;
function save(){
  wr(K,items);
  if(ref){const data={items:items.slice()};q=q.then(()=>ref.set(data)).catch(()=>{})}
}
function initHist(){
  let a=rd(HK).filter(x=>x&&typeof x.n==='string');
  if(!a.length)a=rd(NK).filter(x=>typeof x==='string').map(n=>({n,c:1,d:null}));
  items.forEach(i=>{if(!a.some(x=>x.n.toLowerCase()===i.n.toLowerCase()))a.push({n:i.n,c:1,d:null})});
  return a;
}
const dl=s=>{const[y,m,d]=s.split('-').map(Number),t=new Date();t.setHours(0,0,0,0);return Math.round((new Date(y,m-1,d)-t)/864e5)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function remember(n,days,inc){
  const i=hist.findIndex(x=>x.n.toLowerCase()===n.toLowerCase());
  const o=i>=0?hist.splice(i,1)[0]:{n,c:0,d:null};
  o.n=n;if(inc)o.c++;if(days>=0)o.d=days;
  hist.unshift(o);hist=hist.slice(0,100);wr(HK,hist);
}
let keepScroll=false;
function quick(){
  const rec=hist.slice(0,10),fr=hist.filter(x=>x.c>=2&&!rec.includes(x)).sort((a,b)=>b.c-a.c).slice(0,10);
  const chip=x=>`<span class="chip"><button class="cb" data-i="${hist.indexOf(x)}">${esc(x.n)}</button><button class="cx" data-i="${hist.indexOf(x)}" aria-label="Убрать ${esc(x.n)} из истории"><svg viewBox="0 0 12 12"><path d="M2 2l8 8M10 2l-8 8"/></svg></button></span>`;
  const sec=(t,a)=>a.length?`<h2>${t}</h2><div class="chips">${a.map(chip).join('')}</div>`:'';
  const sl=keepScroll?[...$('qk').querySelectorAll('.chips')].map(e=>e.scrollLeft):[];keepScroll=false;
  $('qk').innerHTML=sec('Недавние',rec)+sec('Частые',fr);
  $('qk').querySelectorAll('.chips').forEach((e,k)=>{e.scrollLeft=sl[k]||0});
  $('qk').hidden=!hist.length;
}
function toast(t){
  clearTimeout(timer);
  $('tt').innerHTML=`<div class="toast"><span>${esc(t)}</span><button id="un">Отменить</button></div>`;
  timer=setTimeout(()=>{$('tt').innerHTML='';undo=null},7000);
}
function render(){
  const t0=new Date();t0.setHours(0,0,0,0);
  const rows=items.map(i=>{const[y,m,d]=i.e.split('-').map(Number),dt=new Date(y,m-1,d);return{...i,dt,k:Math.round((dt-t0)/864e5)}}).sort((a,b)=>a.k-b.k);
  const hot=rows.filter(r=>r.k<=3).length,c=rows.length;
  $('sum').textContent=c?`${c} ${pl(c,'продукт','продукта','продуктов')}`+(hot?` · срочно съесть: ${hot}`:''):'';
  $('l').innerHTML=c?rows.map(r=>{
    if(r.id===editId)return `<li class="ed" data-id="${r.id}"><input class="en" value="${esc(r.n)}" maxlength="60" list="sg" autocomplete="off" aria-label="Название"><label><span>Годен до</span><input class="ee" type="date" value="${r.e}"></label><div class="eb"><button class="sv">Сохранить</button><button class="cn">Отмена</button></div></li>`;
    const k=r.k,s=k<0?'rd':k<=3?'wn':'ok';
    const fd=r.dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short',...(r.dt.getFullYear()!=t0.getFullYear()&&{year:'numeric'})});
    const st=k<0?`просрочено на ${-k} ${pl(-k,'день','дня','дней')}`:k==0?'истекает сегодня':`ещё ${k} ${pl(k,'день','дня','дней')}`;
    return `<li class="${s}" data-id="${r.id}"><div class="n"><b>${k<0?'−'+-k:k}</b><i>дн.</i></div><div class="t"><b>${esc(r.n)}</b><small>до ${fd} · ${st}</small></div><button class="x" aria-label="Удалить ${esc(r.n)}">Удалить</button></li>`;
  }).join(''):'<li class="em">Холодильник пуст. Нажмите «+», чтобы добавить первый продукт.</li>';
  $('sg').innerHTML=[...new Set([...hist.map(x=>x.n),...items.map(i=>i.n)])].map(n=>`<option value="${esc(n)}">`).join('');
  quick();
  renderHist();
}
$('f').onsubmit=e=>{
  e.preventDefault();
  const n=$('n').value.trim(),d=$('d').value;
  if(!n||!d)return;
  items.push({id:uid(),n,e:d});remember(n,dl(d),true);editId=null;
  save();e.target.reset();closeSheet();setTab('list');render();
};
$('l').onclick=e=>{
  const b=e.target.closest('button'),li=e.target.closest('li');
  if(!li||!li.dataset.id||(!b&&li.classList.contains('ed')))return;
  const id=li.dataset.id;
  if(!b){
    editId=id;render();
    const f=document.querySelector('.en');if(f){f.focus();f.select()}
  }else if(b.classList.contains('cn')){
    editId=null;render();
  }else if(b.classList.contains('sv')){
    const n=li.querySelector('.en').value.trim(),d=li.querySelector('.ee').value;
    if(!n||!d)return;
    const it=items.find(i=>i.id===id);
    if(it){it.n=n;it.e=d;remember(n)}
    editId=null;save();render();
  }else if(b.classList.contains('x')){
    const i=items.findIndex(x=>x.id===id);
    if(i<0)return;
    undo=items.splice(i,1)[0];
    save();render();toast(`Удалено: ${undo.n}`);
  }
};
$('qk').onclick=e=>{
  const b=e.target.closest('button'),i=b?+b.dataset.i:-1,x=hist[i];
  if(!x)return;
  if(b.classList.contains('cx')){hist.splice(i,1);wr(HK,hist);keepScroll=true;render();return}
  $('n').value=x.n;
  if(x.d!=null){const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()+x.d);$('d').value=iso(t)}
};
$('tt').onclick=e=>{
  if(!e.target.closest('#un')||!undo)return;
  clearTimeout(timer);items.push(undo);undo=null;
  $('tt').innerHTML='';save();render();
};
function setTab(t){
  $('v-list').hidden=t!=='list';$('v-hist').hidden=t!=='hist';
  document.querySelectorAll('#bar button').forEach(b=>b.setAttribute('aria-current',b.dataset.t===t));
  scrollTo(0,0);
}
function openSheet(x){
  $('f').reset();
  if(x){
    $('n').value=x.n;
    if(x.d!=null){const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()+x.d);$('d').value=iso(t)}
  }
  $('sh').classList.add('open');
}
function closeSheet(){$('sh').classList.remove('open');if(document.activeElement)document.activeElement.blur()}
function renderHist(){
  const s=$('hq').value.trim().toLowerCase();
  const rows=hist.map((x,i)=>({x,i})).filter(r=>r.x.n.toLowerCase().includes(s));
  $('hsum').textContent=hist.length?`${hist.length} ${pl(hist.length,'продукт','продукта','продуктов')}`:'';
  $('hl').innerHTML=rows.length?rows.map(({x,i})=>{
    if(i===hEdit)return `<li class="ed" data-i="${i}"><input class="hn" value="${esc(x.n)}" maxlength="60" autocomplete="off" aria-label="Название"><label><span>Обычный срок, дней</span><input class="hd" type="number" inputmode="numeric" min="0" max="3650" value="${x.d==null?'':x.d}" placeholder="—"></label><div class="eb"><button class="sv">Сохранить</button><button class="cn">Отмена</button></div><button class="x del">Удалить из истории</button></li>`;
    const sub=[x.c?`добавлено ${x.c} ${pl(x.c,'раз','раза','раз')}`:'',x.d==null?'':`обычно ${x.d} ${pl(x.d,'день','дня','дней')}`].filter(Boolean).join(' · ');
    return `<li data-i="${i}"><div class="t"><b>${esc(x.n)}</b>${sub?`<small>${sub}</small>`:''}</div><button class="pl" aria-label="Добавить ${esc(x.n)}"><svg viewBox="0 0 12 12"><path d="M6 1.5v9M1.5 6h9"/></svg></button></li>`;
  }).join(''):`<li class="em">${hist.length?'Ничего не найдено.':'Здесь появятся продукты, которые вы добавляли.'}</li>`;
}
$('bar').onclick=e=>{const b=e.target.closest('button');if(b)setTab(b.dataset.t)};
$('fab').onclick=()=>openSheet();
$('shx').onclick=closeSheet;
$('sh').onclick=e=>{if(e.target===$('sh'))closeSheet()};
$('hq').oninput=renderHist;
$('hl').onclick=e=>{
  const li=e.target.closest('li'),b=e.target.closest('button');
  if(!li||li.dataset.i===undefined)return;
  const i=+li.dataset.i,x=hist[i];
  if(!x)return;
  if(!b){
    if(!li.classList.contains('ed')){hEdit=i;renderHist();const f=document.querySelector('.hn');if(f)f.focus()}
    return;
  }
  if(b.classList.contains('pl'))openSheet(x);
  else if(b.classList.contains('cn')){hEdit=null;renderHist()}
  else if(b.classList.contains('del')){hist.splice(i,1);hEdit=null;wr(HK,hist);render()}
  else if(b.classList.contains('sv')){
    const n=li.querySelector('.hn').value.trim(),v=li.querySelector('.hd').value;
    if(n)x.n=n;
    x.d=v===''?null:Math.max(0,Math.min(3650,Math.round(+v)));
    hEdit=null;wr(HK,hist);render();
  }
};
document.addEventListener('touchstart',()=>{},{passive:true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!editId&&hEdit===null)render()});
render();
(async()=>{
  try{
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    const r=db.collection('data/users/'+id).doc('fridge'),s=await r.get();
    if(s.exists){const v=s.data().items;if(Array.isArray(v))items=v.map(x=>({...x}))}
    else if(items.length)await r.set({items:items.slice()});
    ref=r;render();wr(K,items);
  }catch(e){}
})();
</script>
</body>
</html>
