<title>Холодильник</title>
<style>
:root{color-scheme:light dark;--bg:#eef3f6;--card:#fff;--tx:#14232b;--mu:#62757f;--ln:#d9e2e8;--ac:#0b6f8f;--acx:#fff;--ok:#1f8f4a;--wn:#c76a00;--rd:#dc3d31;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1417;--card:#172228;--tx:#e8f1f5;--mu:#8da1ab;--ln:#26353d;--ac:#59c6e6;--acx:#04222c}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1417;--card:#172228;--tx:#e8f1f5;--mu:#8da1ab;--ln:#26353d;--ac:#59c6e6;--acx:#04222c}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{margin:8px 0 2px;font-size:32px;letter-spacing:-.02em}
#sum{margin:0 0 18px;min-height:1.35em;color:var(--mu);font-size:15px}
form{display:grid;gap:10px;padding:14px;background:var(--card);border:1px solid var(--ln);border-radius:18px}
input{width:100%;min-height:46px;padding:0 12px;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--ln);border-radius:12px;-webkit-appearance:none;appearance:none}
input[type=date]{text-align:left}
input::-webkit-date-and-time-value{text-align:left}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label{display:flex;align-items:center;gap:12px;color:var(--mu);font-size:15px}
label span{flex:none}
.add{min-height:48px;border:0;border-radius:12px;background:var(--ac);color:var(--acx);font:inherit;font-weight:650;touch-action:manipulation}
ul{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:12px;padding:12px;background:var(--card);border:1px solid var(--ln);border-radius:18px}
.n{flex:none;width:54px;height:54px;display:grid;place-content:center;text-align:center;line-height:1.1;color:#fff;background:var(--ok);border-radius:14px}
.n b{font-size:21px}
.n i{font-size:11px;font-style:normal;opacity:.9}
.wn .n{background:var(--wn)}
.rd .n{background:var(--rd)}
.t{flex:1;min-width:0}
.t b{display:block;font-size:17px;overflow-wrap:anywhere}
.t small{color:var(--mu);font-size:14px}
.rd .t small{color:var(--rd)}
.x{flex:none;min-height:44px;padding:0 8px;border:0;background:none;color:var(--rd);font:inherit;font-size:15px;touch-action:manipulation}
.em{display:block;padding:28px 12px;text-align:center;color:var(--mu);background:none;border:1px dashed var(--ln)}
.ac{flex:none;display:flex;flex-direction:column;align-items:flex-end}
.ac button{min-height:34px;padding:0 6px;border:0;background:none;font:inherit;font-size:14px;touch-action:manipulation}
.ch{color:var(--ac)}
.ed{flex-direction:column;align-items:stretch;gap:10px}
.ed label{width:100%}
.ed .eb{display:flex;gap:10px}
.ed .eb button{flex:1;min-height:44px;border:0;border-radius:12px;font:inherit;font-weight:650;touch-action:manipulation}
.ed .eb .sv{background:var(--ac);color:var(--acx)}
.ed .eb .cn{background:var(--bg);color:var(--tx);border:1px solid var(--ln)}
#tt{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;justify-content:center;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
.toast{display:flex;align-items:center;gap:14px;width:100%;max-width:528px;padding:10px 12px 10px 16px;background:var(--tx);color:var(--bg);border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.28);font-size:15px;pointer-events:auto}
.toast span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast button{flex:none;min-height:40px;padding:0 6px;border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;touch-action:manipulation}
</style>
</head>
<body>
<main>
<h1>Холодильник</h1>
<p id="sum"></p>
<form id="f">
<input id="n" placeholder="Продукт, например «Молоко»" maxlength="60" autocomplete="off" list="sg" required>
<label><span>Годен до</span><input id="d" type="date" required></label>
<button class="add">Добавить в холодильник</button>
</form>
<ul id="l"></ul>
</main>
<datalist id="sg"></datalist>
<div id="tt"></div>
<script>
const $=id=>document.getElementById(id),K='fridge-v1',NK='fridge-names';
const pl=(n,a,b,c)=>{const m=n%100,k=n%10;return m>10&&m<20?c:k==1?a:k>1&&k<5?b:c};
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rd=k=>{try{return JSON.parse(localStorage.getItem(k)||'[]')}catch(e){return[]}};
const wr=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let items=rd(K),names=rd(NK),ref=null,q=Promise.resolve(),editId=null,undo=null,timer=0;
function save(){
  wr(K,items);
  if(ref){const data={items:items.slice()};q=q.then(()=>ref.set(data)).catch(()=>{})}
}
function remember(n){
  names=[n,...names.filter(x=>x.toLowerCase()!==n.toLowerCase())].slice(0,100);
  wr(NK,names);
}
function toast(t){
  clearTimeout(timer);
  $('tt').innerHTML=`<div class="toast"><span>${esc(t)}</span><button id="un">Отменить</button></div>`;
  timer=setTimeout(()=>{$('tt').innerHTML='';undo=null},7000);
}
function render(){
  const t0=new Date();t0.setHours(0,0,0,0);
  const rows=items.map(i=>{const[y,m,d]=i.e.split('-').map(Number),dt=new Date(y,m-1,d);return{...i,dt,k:Math.round((dt-t0)/864e5)}}).sort((a,b)=>a.k-b.k);
  const hot=rows.filter(r=>r.k<=3).length,c=rows.length;
  $('sum').textContent=c?`${c} ${pl(c,'продукт','продукта','продуктов')}`+(hot?` · срочно съесть: ${hot}`:''):'';
  $('l').innerHTML=c?rows.map(r=>{
    if(r.id===editId)return `<li class="ed" data-id="${r.id}"><input class="en" value="${esc(r.n)}" maxlength="60" list="sg" autocomplete="off" aria-label="Название"><label><span>Годен до</span><input class="ee" type="date" value="${r.e}"></label><div class="eb"><button class="sv">Сохранить</button><button class="cn">Отмена</button></div></li>`;
    const k=r.k,s=k<0?'rd':k<=3?'wn':'ok';
    const fd=r.dt.toLocaleDateString('ru-RU',{day:'numeric',month:'short',...(r.dt.getFullYear()!=t0.getFullYear()&&{year:'numeric'})});
    const st=k<0?`просрочено на ${-k} ${pl(-k,'день','дня','дней')}`:k==0?'истекает сегодня':`ещё ${k} ${pl(k,'день','дня','дней')}`;
    return `<li class="${s}" data-id="${r.id}"><div class="n"><b>${k<0?'−'+-k:k}</b><i>дн.</i></div><div class="t"><b>${esc(r.n)}</b><small>до ${fd} · ${st}</small></div><div class="ac"><button class="ch" aria-label="Изменить ${esc(r.n)}">Изменить</button><button class="x" aria-label="Удалить ${esc(r.n)}">Удалить</button></div></li>`;
  }).join(''):'<li class="em">Холодильник пуст. Добавьте первый продукт выше.</li>';
  $('sg').innerHTML=[...new Set([...names,...items.map(i=>i.n)])].map(n=>`<option value="${esc(n)}">`).join('');
}
$('f').onsubmit=e=>{
  e.preventDefault();
  const n=$('n').value.trim(),d=$('d').value;
  if(!n||!d)return;
  items.push({id:uid(),n,e:d});remember(n);editId=null;
  save();e.target.reset();render();
};
$('l').onclick=e=>{
  const b=e.target.closest('button'),li=e.target.closest('li');
  if(!b||!li||!li.dataset.id)return;
  const id=li.dataset.id;
  if(b.classList.contains('ch')){
    editId=id;render();
    const f=document.querySelector('.en');if(f){f.focus();f.select()}
  }else if(b.classList.contains('cn')){
    editId=null;render();
  }else if(b.classList.contains('sv')){
    const n=li.querySelector('.en').value.trim(),d=li.querySelector('.ee').value;
    if(!n||!d)return;
    const it=items.find(i=>i.id===id);
    if(it){it.n=n;it.e=d;remember(n)}
    editId=null;save();render();
  }else if(b.classList.contains('x')){
    const i=items.findIndex(x=>x.id===id);
    if(i<0)return;
    undo=items.splice(i,1)[0];
    save();render();toast(`Удалено: ${undo.n}`);
  }
};
$('tt').onclick=e=>{
  if(!e.target.closest('#un')||!undo)return;
  clearTimeout(timer);items.push(undo);undo=null;
  $('tt').innerHTML='';save();render();
};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!editId)render()});
render();
(async()=>{
  try{
    const[db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();
    if(!id)return;
    const r=db.collection('data/users/'+id).doc('fridge'),s=await r.get();
    if(s.exists){const v=s.data().items;if(Array.isArray(v))items=v.map(x=>({...x}))}
    else if(items.length)await r.set({items:items.slice()});
    ref=r;render();wr(K,items);
  }catch(e){}
})();
</script>
</body>
</html>
